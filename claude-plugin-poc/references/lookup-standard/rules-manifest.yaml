# rules-manifest.yaml
#
# Compact routing manifest for all standards in this repository.
# AI agents and tooling SHOULD consult this file (not the rule bodies) to
# determine which standards apply to a given task or file path.
#
# Schema per entry:
#   id:          Stable rule-set identifier (matches file frontmatter)
#   file:        Path to the standard relative to repository root
#   phase:       SDLC phase name
#   title:       Short human-readable title
#   summary:     One-sentence description
#   tags:        List of topic tags for keyword-based routing
#   applies_to:  Glob pattern(s) — the task/file types this standard governs
#   tech:        Technology name for overlays; null for agnostic standards
#   extends:     For overlays — path to the agnostic standard being extended
#
# Maintenance: add an entry here for EVERY new standard file added to the repo.
# See governance/rule-authoring.md for the full contribution process.

version: "1.0.0"

